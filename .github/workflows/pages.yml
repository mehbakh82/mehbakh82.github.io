name: Sync projects and deploy portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stage the static site
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp -R .nojekyll *.html *.css *.js robots.txt sitemap.xml assets research "$RUNNER_TEMP/site/"

      - name: Refresh the public project index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "users/$GITHUB_REPOSITORY_OWNER/repos?type=owner&per_page=100&sort=full_name" > "$RUNNER_TEMP/repos.json"
          python3 scripts/sync_projects.py "$RUNNER_TEMP/repos.json" "$RUNNER_TEMP/site/projects.html"

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
